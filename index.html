<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="The Journey">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0e0c09;--panel:#171410;--panel2:#14110c;--panel3:#221e17;--line:#2e2819;--leather:#4d4023;--gold:#c8a050;--gold-hi:#e8c878;--gold-dim:#7a5e28;--text:#d4c8a8;--dim:#8f8160;--moss-hi:#8fb872;--slate:#6a8aa0;--ink:#2b2118;--ink-soft:#4a3f30;--ps:#b8a374}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a1610,#0e0c09 62%);font-family:'Crimson Text',serif;font-size:17px;color:var(--text)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.app{max-width:1400px;margin:0 auto;padding:12px 14px 90px}
.app-header{text-align:center}
.app-header h1{font-family:'Uncial Antiqua','Cinzel',serif;font-weight:400;color:var(--gold);letter-spacing:8px;font-size:clamp(26px,5vw,38px);margin:4px 0 0}
.user-bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-dim)}
.user-link{background:none;border:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--gold-dim)}.user-link:hover{color:var(--gold-hi)}
.dot{width:7px;height:7px;border-radius:50%;background:#6b8f4e;display:inline-block}
.btn{font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;background:var(--panel3);color:var(--gold);border:1px solid var(--gold-dim);border-radius:2px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.ghost{border-color:var(--line);color:var(--dim)}.btn.sm{padding:5px 10px;font-size:10px}.btn.danger{color:#e08a75;border-color:#7a3d30}
.main-tabs{display:flex;justify-content:center;gap:4px;margin:14px 0 18px}
.main-tab{font-family:'Cinzel',serif;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);text-transform:uppercase;letter-spacing:1.4px;font-size:12px;padding:9px 14px;cursor:pointer}
.main-tab.active{color:var(--gold-hi);border-bottom-color:var(--gold)}
.muted{color:var(--dim);font-size:14px}
.fab{position:fixed;right:16px;bottom:16px;height:54px;min-width:54px;padding:0 16px;border-radius:27px;background:var(--panel3);border:2px solid var(--gold);color:var(--gold-hi);font-size:28px;display:flex;align-items:center;justify-content:center;gap:8px;z-index:40;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.6)}
.fab small{display:none;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
@media(min-width:700px){.fab small{display:inline}}
/* atlas */
.a-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a-bar input{flex:1;min-width:160px;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 10px}
.f-body{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.f-body select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:6px 8px}.f-body label{font-size:14px;color:var(--dim);display:flex;gap:5px;align-items:center}
#stats{margin:10px 0 14px}
.layout{display:block}.sidebar{display:none}
@media(min-width:1000px){.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}.sidebar{display:block;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;border-right:1px solid var(--line);padding-right:10px}}
.side-title{font-family:'Cinzel',serif;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;font-size:11px;margin-bottom:6px}
.tree-line{display:flex;align-items:center}
.chev{width:20px;background:none;border:none;color:var(--gold-dim);cursor:pointer;padding:0;font-size:11px}
.tree-row{flex:1;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;padding:4px 6px;font-size:15px;display:flex;justify-content:space-between;gap:6px;border-left:2px solid transparent}
.tree-row:hover{background:rgba(200,160,80,.07)}.tree-row.active{border-left-color:var(--gold);color:var(--gold-hi)}
.cnt{color:var(--dim);font-size:12px}
.crumbs{font-size:15px;margin-bottom:12px;color:var(--dim)}.crumbs button{background:none;border:none;color:var(--gold);cursor:pointer;padding:0;font:inherit}.crumbs b{color:var(--gold-hi);font-weight:600}
.seg{display:inline-flex;margin:0 0 12px}
.seg button{background:none;border:1px solid var(--leather);color:var(--dim);padding:6px 12px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-left:-1px}
.seg button.on{background:var(--panel3);color:var(--gold-hi);border-color:var(--gold);position:relative}
.hero{display:grid;grid-template-columns:1fr;background:var(--panel);margin-bottom:22px}
@media(min-width:760px){.hero{grid-template-columns:280px 1fr}}
.hero-img,.card-img{position:relative;background:#0a0806;overflow:hidden}.hero-img{aspect-ratio:16/10}@media(min-width:760px){.hero-img{aspect-ratio:auto;min-height:220px}}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;opacity:.35}
.hero-img img,.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-body{padding:16px 20px}
.kindlabel{font-size:14px;color:var(--dim)}
.hero h2{font-family:'Cinzel',serif;color:var(--gold-hi);margin:2px 0 10px;font-size:26px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.stars{display:inline-flex}.star-b{background:none;border:0;color:var(--leather);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}.star-b.on{color:var(--gold-hi)}.star-b:hover{color:var(--gold)}.rt{color:var(--gold-hi);font-size:13px;letter-spacing:1px}
.vis{display:inline-flex;align-items:center;gap:8px;color:var(--dim)}.vis b{color:var(--gold-hi);min-width:28px;text-align:center}.sg{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.sg small{display:block;color:var(--dim);font-size:13px}.sg .btn{flex:none}
.addr{color:var(--dim);font-size:15px}.addr a,.ev-sub a{color:var(--gold);text-decoration:none}.addr a:hover{text-decoration:underline}.hint{color:var(--dim);font-style:italic;font-size:14px}
.chips{margin:4px 0 6px;color:var(--gold-dim);font-size:14px}
.info{white-space:pre-line;margin:12px 0;line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8px 0;font-size:15px}
.block{margin-top:16px}
.block h3{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dim);margin:0 0 6px;font-weight:600}
.pois{list-style:none;margin:0 0 8px;padding:0}.pois li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.pois label{display:flex;gap:8px;cursor:pointer}.pois .done{text-decoration:line-through;color:var(--dim)}
.pois button,.x-btn{background:none;border:none;color:var(--dim);cursor:pointer}
.inline-add{display:flex;gap:6px}.inline-add input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 8px}
.linkbtn{display:inline-block;margin:0 10px 4px 0;font-size:15px;color:var(--gold);text-decoration:none}.linkbtn:hover{color:var(--gold-hi);text-decoration:underline}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}.list-head h3{font-family:'Cinzel',serif;color:var(--gold);margin:0 0 6px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:699px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--panel);cursor:pointer;overflow:hidden;transition:transform .15s}.card:hover{transform:translateY(-2px)}
.card-img{aspect-ratio:4/3}.card-body{padding:9px 10px 11px}
.card-title{font-family:'Cinzel',serif;font-size:15px;font-weight:600;line-height:1.2}.card-sub{font-size:13px;color:var(--dim);margin-top:2px}
.card-badges{margin-top:5px;display:flex;gap:8px;align-items:center}
.bar{height:3px;background:#2a261e;margin-top:8px}.bar i{display:block;height:100%;background:#5a8a40}
.stamp{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}.stamp.planned{color:var(--slate)}.stamp.visited{color:var(--moss-hi)}
.star{color:var(--gold-hi)}
.empty{text-align:center;color:var(--dim);font-style:italic;padding:40px 10px}
#mapEl{height:calc(100vh - 260px);min-height:420px;background:#1a1610}@media(max-width:699px){#mapEl{height:66vh}}
#tmEl,#mapEl{position:relative;z-index:0;isolation:isolate}#tmEl{height:340px;background:#1a1610;border:1px solid var(--line)}#tmEl .leaflet-tile-pane{filter:sepia(.85) saturate(.9) brightness(.9) contrast(1.05) hue-rotate(-8deg)}.tm{margin:10px 0 14px}.tm-cap{flex:1;min-width:150px;font-size:14px}.tm-cap small{color:var(--dim)}.tm-pin{width:26px;height:26px;border-radius:50%;background:var(--panel3);border:2px solid var(--gold-dim);color:var(--gold-hi);font:700 13px/22px Georgia,serif;text-align:center;opacity:.8}.tm-pin.on{background:#8a2f1e;border-color:var(--gold-hi);color:#fff;opacity:1;box-shadow:0 0 0 3px rgba(200,160,80,.35)}.tm-pin.past{opacity:.45}
#mapEl .leaflet-tile-pane{filter:sepia(.85) saturate(.9) brightness(.9) contrast(1.05) hue-rotate(-8deg)}
.leaflet-popup-content-wrapper{background:#f0e2c0;color:var(--ink);border-radius:2px;font-family:'Crimson Text',serif}.leaflet-popup-tip{background:#f0e2c0}
.pop-sub{font-size:13px;color:var(--ink-soft)}.pop button{margin-top:6px;background:#221e17;color:#c8a050;border:1px solid #7a5e28;padding:3px 10px;cursor:pointer}
.pin{width:30px;height:30px;border-radius:50%;background:#14110c;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pin.visited{border-color:#8fb872}.pin.planned{border-color:#6a8aa0}.pin.must{box-shadow:0 0 0 3px rgba(232,200,120,.45),0 2px 6px rgba(0,0,0,.6)}
.map-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
/* trips (timeline) */
.trip{max-width:760px;margin:0 auto}
.t-top{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px;align-items:center}
.t-top select{background:var(--panel2);color:var(--text);border:1px solid var(--leather);padding:6px 8px;max-width:60%;min-width:170px}
.t-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.t-head h2{font-family:'Cinzel',serif;color:var(--gold-hi);margin:0;font-size:28px;font-weight:600}
.t-dates{margin:4px 0 8px}
.t-cover{width:120px;height:100px;object-fit:cover;flex:none}
.dayhdr{background:#1f1b13;color:var(--gold);font-family:'Cinzel',serif;letter-spacing:1.2px;text-transform:uppercase;font-size:13px;padding:10px 12px;margin:16px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;scroll-margin-top:10px}
.dayhdr.today{background:#2d2510;color:var(--gold-hi)}.dayhdr small{color:var(--dim);font-size:11px;letter-spacing:1px;margin-left:8px}
.dayhdr button{background:none;border:none;color:var(--gold-dim);cursor:pointer;font-size:15px}
.ev{--tw:56px;--iw:40px;--g:10px;display:grid;grid-template-columns:var(--tw) var(--iw) 1fr;gap:0 var(--g);position:relative;padding-bottom:20px;cursor:pointer}
.ev::before{content:'';position:absolute;left:calc(var(--tw) + var(--g) + var(--iw)/2 - 1.5px);top:0;bottom:0;width:3px;background:#3a3325}
.ev:first-child::before{top:20px}.ev:last-child::before{bottom:auto;height:20px}.ev:only-child::before{display:none}
.ev-time{text-align:right;font-family:'Cinzel',serif;font-size:16px;padding-top:9px;line-height:1.1}.ev-time small{display:block;color:var(--dim);font-size:11px;font-family:'Crimson Text',serif;margin-top:2px}
.ev-ic{width:var(--iw);height:var(--iw);border-radius:50%;background:#2e2a20;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;z-index:1}
.ev-body{min-width:0;padding-top:1px}
.ev-title{font-weight:600;font-size:19px;line-height:1.2}.ev-sub{color:var(--dim);font-size:15px;line-height:1.3}
.ev-conf{display:inline-block;margin-top:3px;font-size:14px;color:var(--gold)}
.ev-more{margin-top:8px;padding:9px 11px;background:var(--panel);font-size:15px;display:flex;flex-direction:column;gap:7px;cursor:default}
.ev-more .row{margin:0}.ev-more .notes{white-space:pre-line}
/* passport */
.pp-sum{text-align:center;font-family:'Cinzel',serif;color:var(--gold);letter-spacing:1px;margin-bottom:16px}
.pp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.pp{background:linear-gradient(180deg,#f5e6c8,#e0cea0);color:var(--ink);border:3px solid var(--leather);padding:12px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.pp h4{font-family:'Cinzel',serif;margin:0 0 6px;font-size:16px}.pp .muted{color:var(--ink-soft)}
.pp-slot{height:150px;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:6px}
.pp-slot.empty{border:2px dashed var(--ps);color:#9a8758;font-size:14px;font-style:italic;padding:8px}
.stamp-img{max-width:150px;max-height:140px;mix-blend-mode:multiply;opacity:.92}
.stamp-ring{border:4px double;border-radius:50%;width:134px;height:134px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;opacity:.88;font-family:'Cinzel',serif;mix-blend-mode:multiply}
.sr-big{font-size:36px;line-height:1}.sr-big.txt{font-size:16px;font-weight:700}
.sr-name{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;line-height:1.1;margin-top:3px;word-break:break-word}.sr-date{font-size:10px;margin-top:3px}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,5,3,.84);display:flex;align-items:flex-start;justify-content:center;padding:26px 12px;overflow-y:auto;z-index:50}
.modal{background:linear-gradient(180deg,#f5e6c8,#e0cea0);color:var(--ink);max-width:580px;width:100%;border:3px solid var(--leather);padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal h2{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:2px;font-size:18px;margin:0 0 12px}
.x{position:absolute;top:8px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-soft)}
.f{display:flex;flex-direction:column;gap:10px}.f label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:2px}
.f input[type=text],.f input[type=url],.f input[type=number],.f input[type=date],.f input[type=datetime-local],.f select,.f textarea{width:100%;font-size:16px;padding:7px 9px;border:1px solid var(--ps);background:#fbf6e8;color:var(--ink)}
.f input[type=color]{width:100%;height:36px;padding:2px;border:1px solid var(--ps);background:#fbf6e8}
.f textarea{min-height:60px;resize:vertical}.fr{display:flex;gap:10px}.fr>div{flex:1;min-width:0}
@media(max-width:480px){.fr{flex-direction:column}}
.f .btn{background:#221e17}.f .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--ink-soft)}.f .btn.danger{background:transparent}
.more{border-top:1px dashed var(--ps);padding-top:8px}.more summary{cursor:pointer;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}.more .f{margin-top:8px}
.lk{background:#fbf6e8;border:1px solid var(--ps);max-height:170px;overflow:auto;margin-top:6px}.lk div{padding:6px 8px;cursor:pointer;font-size:14px;border-bottom:1px solid #e0d2ae}.lk div:hover{background:#f0e2c0}
.status-line{font-style:italic;font-size:14px;color:var(--ink-soft);min-height:18px}
.prev{width:70px;height:50px;object-fit:cover;border:1px solid var(--ps)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}.actions .del{margin-right:auto}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);max-width:90vw;background:#2f4a22;color:#e8f2dc;border:1px solid #5a8a40;padding:9px 16px;z-index:100;font-size:15px}.toast.bad{background:#5c2a1e;color:#fbe9e2;border-color:#e08a75}
.pick{display:flex;gap:6px}.pick input{flex:1;min-width:0}
.f input[type=time]{width:100%;font-size:16px;padding:7px 9px;border:1px solid var(--ps);background:#fbf6e8;color:var(--ink)}
.f .tzin{margin-top:6px;font-size:14px}
.ev.lay{cursor:default;padding-bottom:12px}.ev.lay .ev-ic{background:var(--bg);border:2px solid #3a3325;font-size:15px}.ev.lay .ev-sub{padding-top:9px}
</style>
</head>
<body>
<div id="userBar" class="user-bar" hidden>
  <span><span class="dot"></span> <span id="codeLabel"></span></span>
  <button id="btnRefresh" class="user-link">↻ Refresh</button>
  <button id="btnBackup" class="user-link">⬇ Backup</button>
  <button id="btnKeys" class="user-link">⚙ Keys</button>
  <button id="btnInstall" class="user-link" hidden>📲 Install app</button>
  <button id="btnDisconnect" class="user-link">Switch code</button>
</div>
<div id="toast" class="toast" hidden></div>

<div id="authOverlay" class="modal-overlay" hidden>
  <div class="modal" style="max-width:420px">
    <h2>Connect your ledger</h2>
    <p class="status-line" style="margin-top:-6px">Use the same code on every device — and share it with a travel companion to share the atlas. No password.</p>
    <div style="display:flex;gap:8px;margin:6px 0">
      <div id="genCode" style="flex:1;font-family:'Cinzel',serif;font-size:20px;letter-spacing:3px;background:#fbf6e8;border:1px solid var(--ps);padding:9px;text-align:center"></div>
      <button type="button" class="btn ghost" id="btnCopy" style="color:var(--ink-soft);border-color:var(--ink-soft)">Copy</button>
    </div>
    <div class="actions"><button type="button" class="btn ghost" id="btnRegen" style="color:var(--ink-soft);border-color:var(--ink-soft)">Another</button><button type="button" class="btn" id="btnUseGen" style="background:#221e17">Use this code</button></div>
    <hr style="border:none;border-top:1px dashed var(--ps);margin:16px 0">
    <form id="formCode" class="f"><label>I already have a code</label>
      <input type="text" id="codeIn" placeholder="e.g. BKCX-WH5H" style="text-transform:uppercase;text-align:center;letter-spacing:2px">
      <div class="actions"><button class="btn" style="background:#221e17">Connect</button></div></form>
  </div>
</div>

<div class="app">
  <header class="app-header"><h1>The Journey</h1></header>
  <nav class="main-tabs">
    <button class="main-tab active" data-tab="atlas">🧭 Atlas</button>
    <button class="main-tab" data-tab="trips">✈️ Trips</button>
    <button class="main-tab" data-tab="passport">🛂 Passport</button>
  </nav>

  <section id="tab-atlas">
    <div class="a-bar">
      <input type="search" id="fQ" placeholder="🔍 Search your atlas…">
      <button type="button" id="fBtn" class="btn ghost">Filters</button>
      <div class="seg" id="viewSeg" style="margin:0"><button data-view="list" class="on">List</button><button data-view="map">🗺️ Map</button></div>
    </div>
    <div id="fBody" class="f-body" hidden>
      <select id="fType"></select><select id="fTag"></select>
      <select id="fStatus"><option value="">Any status</option><option value="want">🔖 Wishlist</option><option value="planned">🗓️ Planned</option><option value="visited">✅ Visited</option></select>
      <label><input type="checkbox" id="fMust"> ⭐ Must-see</label>
      <select id="fSort"><option value="priority">Must-see first</option><option value="rating">★ Top rated</option><option value="az">A–Z</option><option value="recent">Recently added</option><option value="status">Status</option></select>
      <button type="button" id="btnClear" class="btn ghost sm">Clear</button>
    </div>
    <div id="stats" class="muted"></div>
    <div id="layout" class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main style="min-width:0">
        <div id="atlas"></div>
        <div id="mapPanel" hidden><div id="mapBar" class="map-bar"></div><div id="mapEl"></div></div>
      </main>
    </div>
  </section>

  <section id="tab-trips" hidden><div id="trips"></div></section>
  <section id="tab-passport" hidden><div id="passport"></div></section>
</div>
<button type="button" class="fab" id="fab" aria-label="Add">+<small>Add</small></button>

<!-- entry form -->
<div id="modalForm" class="modal-overlay" hidden>
  <div class="modal">
    <button class="x" type="button" data-close>&times;</button>
    <h2 id="formTitle">New entry</h2>
    <form id="formEntry" class="f">
      <input type="hidden" id="fId">
      <div class="fr">
        <div><label>Entry</label><select id="eKind"><option value="country">🌍 Country</option><option value="city">🏙️ City</option><option value="place">📍 Place</option></select></div>
        <div id="eParentWrap"><label id="eParentLabel">Belongs to</label><select id="eParent"></select></div>
      </div>
      <div><label>Name</label>
        <div style="display:flex;gap:6px"><input type="text" id="eName" required placeholder="e.g. Louvre Museum — then press Search"><button type="button" class="btn sm" id="btnSearch">🔎 Search</button></div>
        <div class="status-line" id="lkStatus"></div><div class="lk" id="lkRes" hidden></div></div>
      <div id="eAddrWrap"><label>📍 Address</label><input type="text" id="eAddress"></div>
      <div class="fr" id="eCoords" hidden><div><label>Latitude (no address)</label><input type="number" id="eLat" step="any"></div><div><label>Longitude (no address)</label><input type="number" id="eLng" step="any"></div></div>
      <div class="fr"><div><label>🖼️ Photo link</label><input type="url" id="ePhoto" placeholder="https://… (Drive share links work)"></div><div style="flex:0 0 76px"><label>&nbsp;</label><img id="ePrev" class="prev" alt="" hidden></div></div>
      <div><label>Information</label><textarea id="eInfo"></textarea></div>
      <div class="fr"><div class="only-place"><label>Category</label><select id="eType"></select></div><div><label>Status</label><select id="eStatus"><option value="want">🔖 Wishlist</option><option value="planned">🗓️ Planned</option><option value="visited">✅ Visited</option></select></div></div>
      <div class="only-country" style="border:1px dashed var(--ps);padding:10px">
        <label style="margin-bottom:6px">🛂 Passport stamp (shows when the country is marked Visited)</label>
        <div><label>Stamp — image link, emoji or short text</label><input type="text" id="eStamp" placeholder="https://…/stamp.png   or   🥨   or   BERLIN"></div>
        <div class="fr" style="margin-top:8px"><div><label>Ink color</label><input type="color" id="eStampColor" value="#8a2f1e"></div><div><label>Visited on</label><input type="text" id="eVisited" placeholder="May 2025"></div></div>
      </div>
      <details class="more" id="eMore"><summary>More details</summary>
        <div class="f">
                    <div class="fr"><div><label>Tags (comma separated)</label><input type="text" id="eTags" placeholder="romantic, free"></div><div><label>&nbsp;</label><label style="text-transform:none;font-size:16px"><input type="checkbox" id="eMust"> ⭐ Must-see</label></div></div>
          <div class="fr only-place"><div><label>🕒 Opening hours</label><input type="text" id="eHours"></div><div><label>💶 Price</label><input type="text" id="ePrice"></div><div><label>⏳ Visit time (h)</label><input type="number" id="eDur" step="0.5" min="0"><div class="status-line" id="eDurHint"></div></div></div>
          <div class="fr"><div><label>🌤️ Best season</label><input type="text" id="eSeason"></div><div><label>🌐 Website</label><input type="url" id="eSite"></div></div>
          <div><label>🔗 Links — one per line: Label | URL</label><textarea id="eLinks"></textarea></div>
        </div>
      </details>
      <div class="actions"><button type="button" class="btn danger del" id="btnDel" hidden>Delete</button><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save</button></div>
    </form>
  </div>
</div>

<!-- trip activity form -->
<div id="modalItem" class="modal-overlay" hidden>
  <div class="modal">
    <button class="x" type="button" data-close>&times;</button>
    <h2 id="itTitle">New activity</h2>
    <form id="formItem" class="f">
      <input type="hidden" id="iNode"><input type="hidden" id="iLat"><input type="hidden" id="iLon">
      <div><label>Activity type</label><select id="iType"></select><div class="status-line" id="iSt"></div></div>
      <div data-t="flight,train,bus"><label>⚡ Smart fill — paste a confirmation, or type e.g. “TP 36 2025-05-02”</label><textarea id="iPaste" placeholder="Booking e-mail text, or flight number + date"></textarea><button type="button" class="btn sm" id="iFill" style="margin-top:6px">⚡ Fill from text</button><div class="status-line" id="iFillSt"></div></div>
      <div data-t="sight,meal,activity,lodging,other"><label id="iNameL">Place</label>
        <div class="pick"><input type="text" id="iName" placeholder="Search a place, or type a title"><button type="button" class="btn sm" data-pkbtn="iName">🔎</button></div><div class="lk" id="iNameRes" hidden></div></div>
      <div data-t="sight,meal,activity,lodging,other"><label>Address</label><input type="text" id="iAddr"><label style="margin-top:8px">Time zone (auto from the place)</label><input type="text" id="iTz" class="tzin" list="tzlist" placeholder="e.g. Europe/Berlin"></div>
      <div data-t="flight,train,bus,ride"><label id="iFromL">From</label>
        <div class="pick"><input type="text" id="iFrom"><button type="button" class="btn sm" data-pkbtn="iFrom">🔎</button></div><div class="lk" id="iFromRes" hidden></div>
        <label style="margin-top:8px">Time zone (auto)</label><input type="text" id="iFromTz" class="tzin" list="tzlist" placeholder="e.g. America/Fortaleza"></div>
      <div data-t="flight,train,bus,ride"><label id="iToL">To</label>
        <div class="pick"><input type="text" id="iTo"><button type="button" class="btn sm" data-pkbtn="iTo">🔎</button></div><div class="lk" id="iToRes" hidden></div>
        <label style="margin-top:8px">Time zone (auto)</label><input type="text" id="iToTz" class="tzin" list="tzlist" placeholder="e.g. Europe/Lisbon"></div>
      <div class="fr"><div><label id="iStartL">Start</label><input type="datetime-local" id="iStart"></div><div><label id="iEndL">End</label><input type="datetime-local" id="iEnd"></div></div>
      <div class="fr" data-t="lodging"><div><label>Standard check-in time</label><input type="time" id="iStdIn"></div><div><label>Standard check-out time</label><input type="time" id="iStdOut"></div></div>
      <div class="fr" data-t="flight,train,bus"><div><label id="iCarL">Airline</label><input type="text" id="iCarrier"></div><div><label id="iNumL">Flight no.</label><input type="text" id="iNumber"></div></div>
      <div class="fr" data-t="flight,train,bus"><div><label>Seat</label><input type="text" id="iSeat"></div><div><label id="iGateL">Terminal / gate</label><input type="text" id="iGate"></div></div>
      <div class="fr"><div><label>Confirmation</label><input type="text" id="iConf"></div><div><label>Total cost</label><input type="text" id="iCost"></div></div>
      <div><label>Notes</label><textarea id="iNotes"></textarea></div>
      <div><label>Links — one per line: Label | URL (tickets, reservations in your Drive…)</label><textarea id="iLinks"></textarea></div>
      <details class="more"><summary>Contact</summary><div class="f">
        <div class="fr"><div><label>Phone</label><input type="text" id="iPhone"></div><div><label>Email</label><input type="text" id="iEmail"></div></div>
        <div><label>Website</label><input type="url" id="iSite"></div></div></details>
      <div class="actions"><button type="button" class="btn danger del" id="iDel" hidden>Delete</button><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save</button></div>
    </form>
    <datalist id="tzlist"></datalist>
  </div>
</div>

<!-- suggestions -->
<div id="modalSug" class="modal-overlay" hidden>
  <div class="modal" style="max-width:560px">
    <button class="x" type="button" data-close>&times;</button>
    <h2 id="sgTitle">Suggestions</h2>
    <div class="status-line" id="sgSt"></div>
    <div id="sgList"></div>
  </div>
</div>

<!-- api keys -->
<div id="modalKeys" class="modal-overlay" hidden>
  <div class="modal" style="max-width:460px">
    <button class="x" type="button" data-close>&times;</button>
    <h2>API keys</h2>
    <form id="formKeys" class="f">
      <p class="status-line">Stored only on this device — never synced or saved in the file.</p>
      <div><label>AeroDataBox key (RapidAPI) — flight number lookup</label><input type="text" id="kAero" placeholder="x-rapidapi-key"></div>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save</button></div>
    </form>
  </div>
</div>

<!-- trip form -->
<div id="modalTrip" class="modal-overlay" hidden>
  <div class="modal" style="max-width:460px">

</div>

(function(){

function toast(m,bad){var e=$('toast');e.textContent=(bad?'⚠️ ':'')+m;e.className='toast'+(bad?' bad':'');e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true;},bad?8000:2500);}
function p2(n){return (n<10?'0':'')+n;}

function parseLinks(txt){return String(txt||'').split('\n').map(function(l){var p=l.split('|'),u=safe(p.length>1?p.slice(1).join('|'):p[0]);return u?{label:(p.length>1?p[0].trim():'')||u.replace(/^https?:\/\/(www\.)?/,'').split('/')[0],url:u}:null;}).filter(Boolean);}
function linksTxt(a){return (a||[]).map(function(l){return l.label+' | '+l.url;}).join('\n');}
document.addEventListener('error',function(e){if(e.target&&e.target.tagName==='IMG'&&e.target.hasAttribute('data-hide'))e.target.style.display='none';},true);

/* ---------- data ---------- */
function fromRow(r){var n=function(v){return v==null?null:Number(v);};return{id:r.id,kind:r.kind,parentId:r.parent_id||'',name:r.name,photo:r.photo||'',info:r.info||'',address:r.address||'',lat:n(r.lat),lng:n(r.lng),type:r.type||'',tags:r.tags?r.tags.split(',').map(function(t){return t.trim();}).filter(Boolean):[],status:r.status||'want',must:!!r.must,pois:Array.isArray(r.pois)?r.pois:[],links:Array.isArray(r.links)?r.links:[],hours:r.hours||'',price:r.price||'',durationH:n(r.duration_h),season:r.season||'',website:r.website||'',extra:r.extra&&typeof r.extra==='object'?r.extra:{},addedAt:r.added_at?new Date(r.added_at).getTime():Date.now()};}
function toRow(n){return{id:n.id,sync_code:code,kind:n.kind,parent_id:n.parentId||null,name:n.name,photo:n.photo||null,info:n.info||null,address:n.address||null,lat:n.lat,lng:n.lng,type:n.type||null,tags:(n.tags||[]).join(', ')||null,status:n.status,must:!!n.must,pois:n.pois||[],links:n.links||[],hours:n.hours||null,price:n.price||null,duration_h:n.durationH,season:n.season||null,website:n.website||null,extra:n.extra||{},added_at:new Date(n.addedAt||Date.now()).toISOString()};}
function blank(kind,name,parentId){return{id:uid(),kind:kind,parentId:parentId||'',name:name,photo:'',info:'',address:'',lat:null,lng:null,type:'',tags:[],status:'want',must:false,pois:[],links:[],hours:'',price:'',durationH:null,season:'',website:'',extra:{},addedAt:Date.now()};}
function tripFromRow(r){return{id:r.id,name:r.name,startDate:r.start_date||'',endDate:r.end_date||'',cover:r.cover||'',active:!!r.active,items:(Array.isArray(r.items)?r.items:[]).map(function(i){i.type=nTy(i.type);return i;}),addedAt:r.added_at?new Date(r.added_at).getTime():Date.now()};}
function reindex(){S.by={};S.kids={};S.nodes.forEach(function(n){S.by[n.id]=n;});S.nodes.forEach(function(n){var p=n.parentId&&S.by[n.parentId]?n.parentId:'';(S.kids[p]=S.kids[p]||[]).push(n);});}
function cacheNow(){try{localStorage.setItem(CACHE+code,JSON.stringify(S.nodes));}catch(e){}}
function cacheTrips(){try{localStorage.setItem(TCACHE+code,JSON.stringify(S.trips));}catch(e){}}
function loadCache(){try{S.nodes=JSON.parse(localStorage.getItem(CACHE+code)||'[]');}catch(e){S.nodes=[];}}
function loadTripsCache(){try{S.trips=JSON.parse(localStorage.getItem(TCACHE+code)||'[]');S.trips.forEach(function(t){t.items=(t.items||[]).map(function(i){i.type=nTy(i.type);return i;});});}catch(e){S.trips=[];}}
function fail(e){var m=(e&&e.message)||'network error';toast('Not synced: '+m+(/journey_|column|relation/.test(m)?' — run journey-setup.sql in Supabase.':''),true);}
function loadAll(){
  function done(){reindex();
    if(!S.tripId||!S.trips.some(function(t){return t.id===S.tripId;}))S.tripId=S.trips.length?S.trips[0].id:null;
    if(!S.booted){S.booted=true;var a=S.trips.filter(function(t){return t.active;})[0];if(a){S.tripId=a.id;S.tab='trips';applyTab();renderAll();scrollToday();return;}}
    renderAll();}
  if(!sb){loadCache();loadTripsCache();done();toast('Offline — showing saved copy.',true);return;}
  Promise.all([sb.from(TABLE).select('*').eq('sync_code',code),sb.from(TRIPS).select('*').eq('sync_code',code)]).then(function(r){
    if(r[0].error){fail(r[0].error);loadCache();}else{S.nodes=(r[0].data||[]).map(fromRow);cacheNow();}
    if(r[1].error){fail(r[1].error);loadTripsCache();}else{S.trips=(r[1].data||[]).map(tripFromRow);cacheTrips();}
    done();
  },function(e){fail(e);loadCache();loadTripsCache();done();});
}
function saveNode(n){cacheNow();if(!sb)return;sb.from(TABLE).upsert(toRow(n),{onConflict:'id'}).then(function(r){if(r.error)fail(r.error);},fail);}
function delIds(ids){cacheNow();if(!sb)return;sb.from(TABLE).delete().in('id',ids).eq('sync_code',code).then(function(r){if(r.error)fail(r.error);},fail);}

/* ---------- helpers ---------- */
function desc(id){var o=[],st=(S.kids[id]||[]).slice(),n;while(st.length){n=st.pop();o.push(n);(S.kids[n.id]||[]).forEach(function(c){st.push(c);});}return o;}
function path(n){var p=[],c=n;while(c){p.unshift(c);c=c.parentId?S.by[c.parentId]:null;}return p;}
function ctx(n){return path(n).slice(0,-1).reverse().map(function(p){return p.name;}).join(' · ');}
function rat(n){return Math.max(0,Math.min(5,parseInt((n.extra||{}).rating,10)||0));}
function stars(v,x){var o='';for(var i=1;i<=5;i++)o+=x?'<button class="star-b'+(i<=v?' on':'')+'" data-act="rate" data-val="'+i+'" title="'+i+' / 5">★</button>':(i<=v?'★':'☆');return o;}
function vis(n){return Math.max(0,parseInt((n.extra||{}).visits,10)||0);}
function placesIn(n){return n.kind==='place'?[n]:desc(n.id).filter(function(x){return x.kind==='place';});}
function icon(n){return n.kind==='country'?'🌍':n.kind==='city'?'🏙️':(TYPES[n.type]||TYPES.other)[0];}
function az(a,b){return a.name.localeCompare(b.name);}
function plural(n,s,p){return n+' '+(n===1?s:p);}
function hasF(){var f=S.f;return !!(f.q||f.type||f.tag||f.status||f.must);}
function matchSelf(n){var f=S.f;
  if(f.q&&norm([n.name,n.address,n.info,(n.tags||[]).join(' '),n.kind==='place'?(TYPES[n.type]||TYPES.other)[1]:''].join(' ')).indexOf(norm(f.q))<0)return false;
  if(f.type&&!(n.kind==='place'&&n.type===f.type))return false;
  if(f.tag&&n.tags.indexOf(f.tag)<0)return false;
  if(f.status&&n.status!==f.status)return false;
  if(f.must&&!n.must)return false;return true;}
function matches(n){if(!hasF()||matchSelf(n))return true;return n.kind!=='place'&&desc(n.id).some(matchSelf);}
function sortList(a){var s=S.f.sort;return a.slice().sort(function(x,y){
  if(s==='az')return az(x,y);if(s==='recent')return y.addedAt-x.addedAt;
  if(s==='status')return (SORDER[x.status]-SORDER[y.status])||az(x,y);
  if(s==='rating')return (rat(y)-rat(x))||((y.must?1:0)-(x.must?1:0))||az(x,y);
  return ((y.must?1:0)-(x.must?1:0))||(rat(y)-rat(x))||az(x,y);});}
function listFor(){
  var cur=S.nav?S.by[S.nav]:null;
  if(!cur){var k=S.scope==='countries'?'country':S.scope==='cities'?'city':'place';return S.nodes.filter(function(n){return n.kind===k&&matches(n);});}
  if(cur.kind==='country')return S.mode==='places'?desc(cur.id).filter(function(n){return n.kind==='place'&&matches(n);}):(S.kids[cur.id]||[]).filter(function(n){return n.kind==='city'&&matches(n);});
  if(cur.kind==='city')return (S.kids[cur.id]||[]).filter(function(n){return n.kind==='place'&&matches(n);});
  return [];}
function gmaps(n){var q=n.address?encodeURIComponent(n.address):n.lat!=null&&n.lng!=null?n.lat+','+n.lng:encodeURIComponent(n.name+' '+ctx(n));return 'https://www.google.com/maps/search/?api=1&query='+q;}

/* ---------- navigation ---------- */

  document.querySelectorAll('.main-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===S.tab);});}

function renderAll(){
  $('fab').hidden=S.tab==='passport';
  if(S.tab==='trips')return renderTrips();

  $('stats').textContent=S.nodes.length?'🌍 '+S.nodes.filter(function(n){return n.kind==='country';}).length+' · 🏙️ '+S.nodes.filter(function(n){return n.kind==='city';}).length+' · 📍 '+pl.length+' · ✅ '+pl.filter(function(p){return p.status==='visited';}).length+' visited':'';

function refreshFilters(){
  var tc={},gc={};S.nodes.forEach(function(n){if(n.kind==='place'&&n.type)tc[n.type]=(tc[n.type]||0)+1;n.tags.forEach(function(t){gc[t]=(gc[t]||0)+1;});});

  $('fType').innerHTML='<option value="">All categories</option>'+Object.keys(TYPES).filter(function(k){return tc[k];}).map(function(k){return '<option value="'+k+'">'+TYPES[k][0]+' '+TYPES[k][1]+' ('+tc[k]+')</option>';}).join('');
  $('fTag').innerHTML='<option value="">All tags</option>'+Object.keys(gc).sort().map(function(t){return '<option value="'+esc(t)+'">#'+esc(t)+' ('+gc[t]+')</option>';}).join('');
  $('fType').value=S.f.type;$('fTag').value=S.f.tag;}

function renderSidebar(){
  var onp={};if(S.nav&&S.by[S.nav])path(S.by[S.nav]).forEach(function(n){onp[n.id]=1;});
  function row(n,d,cnt,open,canOpen){return '<div class="tree-line" style="padding-left:'+d*14+'px"><button class="chev" data-toggle="'+n.id+'">'+(canOpen?(open?'▾':'▸'):'')+'</button><button class="tree-row'+(S.nav===n.id?' active':'')+'" data-nav="'+n.id+'"><span>'+icon(n)+' '+esc(n.name)+'</span><span class="cnt">'+cnt+'</span></button></div>';}
  var h='<div class="side-title">The Atlas</div><div class="tree-line"><button class="chev"></button><button class="tree-row'+(S.nav===null?' active':'')+'" data-nav="">🧭 World <span class="cnt">'+S.nodes.filter(function(n){return n.kind==='place';}).length+'</span></button></div>';
  S.nodes.filter(function(n){return n.kind==='country';}).sort(az).forEach(function(c){
    var cities=(S.kids[c.id]||[]).filter(function(x){return x.kind==='city';}).sort(az),o=S.open[c.id]||onp[c.id];
    h+=row(c,0,placesIn(c).length,o,cities.length>0);
    if(o)cities.forEach(function(ci){var pl=(S.kids[ci.id]||[]).filter(function(x){return x.kind==='place';}).sort(az),o2=S.open[ci.id]||onp[ci.id];
      h+=row(ci,1,pl.length,o2,pl.length>0);if(o2)pl.forEach(function(p){h+=row(p,2,'',false,false);});});});

function stamp(n){return n.status==='want'?'':'<span class="stamp '+n.status+'">'+SICON[n.status]+' '+STAT[n.status]+'</span>';}
function cardSub(n){
  if(n.kind==='country')return plural((S.kids[n.id]||[]).length,'city','cities')+' · '+plural(placesIn(n).length,'place','places');
  if(n.kind==='city')return ctx(n)+' · '+plural(placesIn(n).length,'place','places');
  return (TYPES[n.type]||TYPES.other)[1]+(ctx(n)?' · '+ctx(n):'');}
function card(n){
  var ph=safe(n.photo),pl=n.kind!=='place'?placesIn(n):[],bar='';
  if(pl.length){var v=pl.filter(function(p){return p.status==='visited';}).length;if(v)bar='<div class="bar" title="'+v+' of '+pl.length+' visited"><i style="width:'+Math.round(v/pl.length*100)+'%"></i></div>';}
  var bd=stamp(n)+(n.must?'<span class="star">⭐</span>':'')+(rat(n)?'<span class="rt" title="Rating">'+stars(rat(n))+'</span>':'');
  return '<div class="card" data-open="'+n.id+'"><div class="card-img"><div class="ph">'+icon(n)+'</div>'+(ph?'<img data-hide src="'+esc(ph)+'" loading="lazy" referrerpolicy="no-referrer" alt="">':'')+'</div><div class="card-body"><div class="card-title">'+icon(n)+' '+esc(n.name)+'</div><div class="card-sub">'+esc(cardSub(n))+'</div>'+(bd?'<div class="card-badges">'+bd+'</div>':'')+bar+'</div></div>';}

function hero(n){
  var ph=safe(n.photo),h='<section class="hero"><div class="hero-img"><div class="ph">'+icon(n)+'</div>'+(ph?'<img data-hide src="'+esc(ph)+'" referrerpolicy="no-referrer" alt="">':'')+'</div><div class="hero-body">';
  h+='<div class="kindlabel">'+icon(n)+' '+(n.kind==='place'?(TYPES[n.type]||TYPES.other)[1]:n.kind==='city'?'City':'Country')+(ctx(n)?' · '+esc(ctx(n)):'')+'</div><h2>'+esc(n.name)+(n.must?' <span class="star">⭐</span>':'')+'</h2>';
  if(n.tags.length)h+='<div class="chips">'+n.tags.map(function(t){return '#'+esc(t);}).join('  ')+'</div>';
  if(n.address)h+='<div class="addr"><a target="_blank" rel="noopener" href="'+esc(gmaps(n))+'">📍 '+esc(n.address)+'</a></div>';
  else if(n.lat!=null)h+='<div class="addr"><a target="_blank" rel="noopener" href="'+esc(gmaps(n))+'">📍 Open in Google Maps</a></div>';
  else if(n.kind==='place'&&n.lat==null)h+='<div class="hint">No location yet — Edit → Search.</div>';
  h+='<div class="row"><div class="seg" style="margin:0">'+['want','planned','visited'].map(function(s){return '<button data-act="status" data-val="'+s+'" class="'+(n.status===s?'on':'')+'">'+SICON[s]+' '+STAT[s]+'</button>';}).join('')+'</div><button class="btn sm ghost" data-act="must">'+(n.must?'⭐ Must-see':'☆ Must-see')+'</button></div>';
  h+='<div class="row"><span class="vis">Rating <span class="stars">'+stars(rat(n),true)+'</span></span></div>';
  h+='<div class="row"><span class="vis">🔁 Visits <button class="btn sm ghost" data-act="vdec"'+(vis(n)?'':' disabled')+'>−</button><b>'+vis(n)+'×</b><button class="btn sm ghost" data-act="vinc">+</button></span></div>';
  h+='<div class="row"><button class="btn sm" data-act="edit">✏️ Edit</button>'+(n.kind!=='place'?'<button class="btn sm ghost" data-act="sugg">✨ Suggestions</button>':'')+(n.kind==='city'?'<button class="btn sm ghost" data-act="refresh" title="Re-fetch API data for this city and its places (fills empty fields and updates ones that came from an API)">🔄 Refresh data</button>':'')+(n.lat!=null?'<button class="btn sm ghost" data-act="showmap">🗺️ On map</button>':'')+(safe(n.website)?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+esc(safe(n.website))+'">🌐 Website ↗</a>':'')+(n.kind!=='place'?'<button class="btn sm ghost" data-act="addchild">+ '+(n.kind==='country'?'🏙️ City':'📍 Place')+'</button>':'')+'</div>';
  if(n.info)h+='<div class="info">'+esc(n.info)+'</div>';
  var facts=[];if(n.kind==='place'){if(n.hours)facts.push('🕒 '+n.hours);if(n.price)facts.push('💶 '+n.price);if(n.durationH!=null)facts.push('⏳ '+(n.extra&&n.extra.durEst?'≈':'')+n.durationH+' h');}
  if(n.season)facts.push('🌤️ '+n.season);

function autoFill(n){var par=n.parentId&&S.by[n.parentId];

    var x=l&&l[0];if(x&&n.lat==null){n.lat=+x.lat;n.lng=+x.lon;}return enrich(n.kind,n.name,par&&par.name,x);}).then(function(e){
    if(e.photo&&!n.photo)n.photo=e.photo;if(e.info&&!n.info)n.info=e.info;if(e.site&&!n.website&&n.kind==='place')n.website=e.site;saveNode(n);renderAll();}).catch(function(){});}
$('formEntry').addEventListener('submit',function(e){
  e.preventDefault();var id=$('fId').value,kind=$('eKind').value,name=$('eName').value.trim();if(!name)return;
  var par=kind==='country'?'':$('eParent').value;
  if(kind!=='country'){
    if(par==='__new__'||(!par&&S.pend))par=makeParents(kind,S.pend||{});
    if(!par){alert('Choose where it belongs — or press Search and pick a result so it can be filed automatically.');return;}}
  if(!id&&S.nodes.some(function(n){return n.kind===kind&&n.parentId===par&&norm(n.name)===norm(name);})&&!confirm('"'+name+'" is already saved here. Add it again?'))return;
  var n=id?S.by[id]:blank(kind,name,par);
  n.kind=kind;n.parentId=par;n.name=name;n.address=kind==='country'?'':$('eAddress').value.trim();n.lat=numOrNull($('eLat').value,-90,90);n.lng=numOrNull($('eLng').value,-180,180);
  if(n.lat==null||n.lng==null){n.lat=null;n.lng=null;}
  n.photo=normPhoto($('ePhoto').value);n.info=$('eInfo').value.trim();n.type=kind==='place'?$('eType').value:'';
  n.tags=$('eTags').value.split(',').map(function(t){return t.trim().toLowerCase();}).filter(function(t,i,a){return t&&a.indexOf(t)===i;});
  n.status=$('eStatus').value;n.must=$('eMust').checked;n.hours=$('eHours').value.trim();n.price=$('ePrice').value.trim();n.durationH=numOrNull($('eDur').value);
  n.season=$('eSeason').value.trim();n.website=$('eSite').value.trim();n.links=parseLinks($('eLinks').value);
  if(kind==='country')n.extra=Object.assign({},n.extra||{},{stamp:$('eStamp').value.trim(),stampColor:$('eStampColor').value,visitedOn:$('eVisited').value.trim()});else n.extra=Object.assign({},n.extra||{},{durEst:!!(S.durEst&&n.durationH!=null)});
  if(!id){S.nodes.push(n);if(S.tab==='atlas'){S.nav=null;S.view='list';S.scope=kind==='country'?'countries':kind==='city'?'cities':'places';}}
  reindex();saveNode(n);closeModals();renderAll();toast('Saved — '+n.name);});
$('btnDel').addEventListener('click',function(){var n=S.by[$('fId').value];if(!n)return;var d=desc(n.id);
  if(!confirm('Delete "'+n.name+'"'+(d.length?' and its '+d.length+' nested entries':'')+'?'))return;
  var ids=[n.id].concat(d.map(function(x){return x.id;})),back=n.parentId;S.nodes=S.nodes.filter(function(x){return ids.indexOf(x.id)<0;});reindex();delIds(ids);
  if(S.nav&&!S.by[S.nav])S.nav=S.by[back]?back:null;closeModals();renderAll();});

/* ---------- search inside the form (free: OpenStreetMap + Wikidata + Wikivoyage) ---------- */
function durHint(){$('eDurHint').textContent=S.durEst&&$('eDur').value?'≈ estimate — adjust if you know better.':'';}
$('eDur').addEventListener('input',function(){S.durEst=false;durHint();});
function searchEntry(){
  var kind=$('eKind').value,name=$('eName').value.trim(),st=$('lkStatus'),res=$('lkRes');if(!name){st.textContent='Type a name first.';return;}
  var tok=++S.tok,trail=[];
  if(kind!=='country'&&S.userParent&&S.by[$('eParent').value])trail=path(S.by[$('eParent').value]).reverse().map(function(p){return p.name;});
  st.textContent='Searching…';res.hidden=true;
  fetch(NOM+'&limit=6&q='+encodeURIComponent([name].concat(trail).join(', '))+(kind==='country'?'&featuretype=country':kind==='city'?'&featuretype=city':'')).then(function(r){if(!r.ok)throw 0;return r.json();}).then(function(list){
    if(tok!==S.tok)return;S.res=list||[];
    if(!S.res.length){st.textContent='Nothing found — fill in manually (address, coordinates, photo link).';return;}
    res.innerHTML=S.res.map(function(x,i){return '<div data-i="'+i+'">'+esc(x.display_name)+'</div>';}).join('');res.hidden=false;st.textContent='Pick the right one:';
  }).catch(function(){if(tok===S.tok)st.textContent='Search failed (network or rate limit). Try again, or fill in manually.';});}
$('btnSearch').addEventListener('click',searchEntry);
$('eName').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();searchEntry();}});
$('lkRes').addEventListener('click',function(ev){
  var d=ev.target.closest('[data-i]');if(!d)return;var x=S.res[+d.getAttribute('data-i')];if(!x)return;var kind=$('eKind').value,et=x.extratags||{},filled=[],osm={};
  function add(k){if(filled.indexOf(k)<0)filled.push(k);}
  $('eName').value=x.name||$('eName').value;$('eLat').value=(+x.lat).toFixed(6);$('eLng').value=(+x.lon).toFixed(6);
  if(kind!=='country')$('eAddress').value=x.display_name;
  coordsVis();
  if(kind==='place'){var gt=inferGuess(x),site=et.website||et['contact:website']||'';$('eType').value=gt;
    if(site&&!/^https?:/i.test(site))site='https://'+site;
    if(safe(site)&&!$('eSite').value){$('eSite').value=site;add('website');}
    if(et.opening_hours&&!$('eHours').value){osm.hours=String(et.opening_hours).slice(0,160);$('eHours').value=osm.hours;add('hours');}
    var pr=et.charge?String(et.charge).slice(0,80):(et.fee==='no'?'Free':'');if(pr&&!$('ePrice').value){osm.price=pr;$('ePrice').value=pr;add('price');}
    if(!$('eDur').value){$('eDur').value=DURS[gt]||1;S.durEst=true;durHint();add('visit time ≈');}
    if(filled.length)$('eMore').open=true;}
  if(kind!=='country'&&!S.userParent){S.pend=pendOf(x);fillParents(kind,'',true,S.pend);}
  var pp=S.by[$('eParent').value],par=kind==='city'?(S.pend&&S.pend.country):kind==='place'?((S.pend&&S.pend.city)||(pp?pp.name:'')):'';
  $('lkRes').hidden=true;$('lkStatus').textContent='Filled in — checking Wikivoyage & Wikidata…';
  var tok=S.tok;
  enrich(kind,$('eName').value,par,x,+x.lat,+x.lon).then(function(e){if(tok!==S.tok)return;
    if(e.photo&&!$('ePhoto').value){$('ePhoto').value=e.photo;prev();add('photo');}
    if(e.info&&!$('eInfo').value){$('eInfo').value=e.info;add('summary');}
    if(kind==='place'){
      if(e.site&&!$('eSite').value){$('eSite').value=e.site;add('website');}
      if(e.hours&&(!$('eHours').value||$('eHours').value===osm.hours)){$('eHours').value=e.hours;add('hours');}
      if(e.price&&(!$('ePrice').value||$('ePrice').value===osm.price)){$('ePrice').value=e.price;add('price');}
      if(e.visitH&&(!$('eDur').value||S.durEst)){$('eDur').value=e.visitH;S.durEst=true;durHint();add('visit time ≈');}
      if(e.hours||e.price||e.site)$('eMore').open=true;}
    $('lkStatus').textContent='Filled in'+(filled.length?': '+filled.join(', '):'')+(e.src?' · source: '+e.src:'')+'. Review and save.';});});
/* ---------- auth / utils ---------- */
var CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){function p(){var s='';for(var i=0;i<4;i++)s+=CH[Math.floor(Math.random()*CH.length)];return s;}return p()+'-'+p();}
function regen(){$('genCode').textContent=genCode();}regen();
$('btnRegen').addEventListener('click',regen);
$('btnCopy').addEventListener('click',function(){if(navigator.clipboard)navigator.clipboard.writeText($('genCode').textContent);toast('Copied');});
$('btnUseGen').addEventListener('click',function(){connect($('genCode').textContent);});
$('formCode').addEventListener('submit',function(e){e.preventDefault();var c=$('codeIn').value.trim().toUpperCase();if(c)connect(c);});
$('btnDisconnect').addEventListener('click',function(){if(!confirm('Disconnect this device from the code? You can reconnect any time.'))return;localStorage.removeItem(CODE_KEY);code=null;S.nodes=[];S.trips=[];S.tripId=null;S.nav=null;S.booted=false;reindex();$('authOverlay').hidden=false;$('userBar').hidden=true;regen();});
$('btnRefresh').addEventListener('click',loadAll);
$('btnBackup').addEventListener('click',function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),nodes:S.nodes,trips:S.trips},null,2)],{type:'application/json'}));a.download='the-journey-backup.json';document.body.appendChild(a);a.click();a.remove();});
function connect(c){code=c;localStorage.setItem(CODE_KEY,c);$('authOverlay').hidden=true;$('userBar').hidden=false;$('codeLabel').textContent=c;loadAll();}
var saved=localStorage.getItem(CODE_KEY);if(saved)connect(saved);else $('authOverlay').hidden=false;
})();
</script>
</body>
