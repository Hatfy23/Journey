<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e0c09">
<title>The Journey</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230e0c09'/%3E%3Ctext y='.9em' x='10' font-size='80'%3E🧭%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0e0c09;--panel:#171410;--panel2:#14110c;--panel3:#221e17;--line:#2e2819;--leather:#4d4023;--gold:#c8a050;--gold-hi:#e8c878;--gold-dim:#7a5e28;--text:#d4c8a8;--dim:#8f8160;--moss-hi:#8fb872;--slate:#6a8aa0;--ink:#2b2118;--ink-soft:#4a3f30;--ps:#b8a374}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{overflow-x:hidden}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1a1610,#0e0c09 62%);font-family:'Crimson Text',serif;font-size:17px;color:var(--text)}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.app{max-width:1400px;margin:0 auto;padding:12px 14px 60px}
.app-header{text-align:center}
.app-header h1{font-family:'Uncial Antiqua','Cinzel',serif;font-weight:400;color:var(--gold);letter-spacing:8px;font-size:clamp(26px,5vw,38px);margin:4px 0 0}
.user-bar{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;padding:5px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-family:'Cinzel',serif;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold-dim)}
.user-link{background:none;border:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--gold-dim)}.user-link:hover{color:var(--gold-hi)}
.dot{width:7px;height:7px;border-radius:50%;background:#6b8f4e;display:inline-block}
.btn{font-family:'Cinzel',serif;font-size:11px;text-transform:uppercase;letter-spacing:1.1px;background:var(--panel3);color:var(--gold);border:1px solid var(--gold-dim);border-radius:2px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn.ghost{border-color:var(--line);color:var(--dim)}.btn.sm{padding:5px 10px;font-size:10px}.btn.danger{color:#e08a75;border-color:#7a3d30}
.main-tabs{display:flex;justify-content:center;gap:6px;margin:14px 0 18px}
.main-tab{font-family:'Cinzel',serif;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);text-transform:uppercase;letter-spacing:1.6px;font-size:12px;padding:9px 16px;cursor:pointer}
.main-tab.active{color:var(--gold-hi);border-bottom-color:var(--gold)}
.sec-title{font-family:'Cinzel',serif;color:var(--gold);font-weight:600;font-size:20px;margin:0 0 12px;letter-spacing:1px}
.muted{color:var(--dim);font-size:14px}
/* discover */
.disc{max-width:760px;margin:0 auto}
.disc-form{display:flex;gap:8px;flex-wrap:wrap}
.disc-form input{flex:1;min-width:200px;background:var(--panel2);color:var(--text);border:1px solid var(--leather);padding:11px 12px;font-size:18px}
.disc-form select{background:var(--panel2);color:var(--text);border:1px solid var(--leather);padding:0 8px}
#dStatus{margin:10px 0 4px;min-height:20px}
.res-list{display:flex;flex-direction:column;gap:6px}
.res{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer}
.res:hover{border-color:var(--gold)}.res .ic{font-size:24px}.res .tx{flex:1;min-width:0}
.res b{font-family:'Cinzel',serif;font-weight:600;font-size:15px;display:block}.res small{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res .go{color:var(--gold);font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase}
.disc-foot{margin-top:14px;text-align:center}
#recent{max-width:760px;margin:28px auto 0}#recent h3{font-family:'Cinzel',serif;color:var(--gold-dim);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px}
.rc{display:inline-block;margin:0 6px 6px 0;padding:4px 10px;border:1px solid var(--line);color:var(--text);cursor:pointer;font-size:15px}.rc:hover{border-color:var(--gold)}
/* atlas */
.a-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.a-bar input{flex:1;min-width:160px;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 10px}
.f-body{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.f-body select{background:var(--bg);color:var(--text);border:1px solid var(--line);padding:6px 8px}.f-body label{font-size:14px;color:var(--dim);display:flex;gap:5px;align-items:center}
#stats{margin:10px 0 14px}
.layout{display:block}.sidebar{display:none}
@media(min-width:1000px){.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px}.sidebar{display:block;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;border-right:1px solid var(--line);padding-right:10px}}
.side-title{font-family:'Cinzel',serif;color:var(--gold-dim);letter-spacing:2px;text-transform:uppercase;font-size:11px;margin-bottom:6px}
.tree-line{display:flex;align-items:center}
.chev{width:20px;background:none;border:none;color:var(--gold-dim);cursor:pointer;padding:0;font-size:11px}
.tree-row{flex:1;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;padding:4px 6px;font-size:15px;display:flex;justify-content:space-between;gap:6px;border-left:2px solid transparent}
.tree-row:hover{background:rgba(200,160,80,.07)}.tree-row.active{border-left-color:var(--gold);color:var(--gold-hi)}
.cnt{color:var(--dim);font-size:12px}
.crumbs{font-size:15px;margin-bottom:12px;color:var(--dim)}.crumbs button{background:none;border:none;color:var(--gold);cursor:pointer;padding:0;font:inherit}.crumbs b{color:var(--gold-hi);font-weight:600}
.seg{display:inline-flex;margin:0 0 12px}
.seg button{background:none;border:1px solid var(--leather);color:var(--dim);padding:6px 12px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-left:-1px}
.seg button.on{background:var(--panel3);color:var(--gold-hi);border-color:var(--gold);position:relative}
.hero{display:grid;grid-template-columns:1fr;background:var(--panel);margin-bottom:22px}
@media(min-width:760px){.hero{grid-template-columns:280px 1fr}}
.hero-img,.card-img{position:relative;background:#0a0806;overflow:hidden}.hero-img{aspect-ratio:16/10}@media(min-width:760px){.hero-img{aspect-ratio:auto;min-height:220px}}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;opacity:.35}
.hero-img img,.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero-body{padding:16px 20px}
.kindlabel{font-size:13px;color:var(--dim)}
.hero h2{font-family:'Cinzel',serif;color:var(--gold-hi);margin:2px 0 10px;font-size:26px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.addr{color:var(--dim);font-size:15px}.hint{color:var(--dim);font-style:italic;font-size:14px}
.chips{margin:4px 0 6px;color:var(--gold-dim);font-size:14px}
.info{white-space:pre-line;margin:12px 0;line-height:1.5}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin:8px 0;font-size:15px}.facts small{color:var(--dim);margin-right:4px}
.block{margin-top:16px}
.block h3{font-family:'Cinzel',serif;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--gold-dim);margin:0 0 6px;font-weight:600}
.pois{list-style:none;margin:0 0 8px;padding:0}.pois li{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
.pois label{display:flex;gap:8px;cursor:pointer}.pois .done{text-decoration:line-through;color:var(--dim)}
.pois button,.x-btn{background:none;border:none;color:var(--dim);cursor:pointer}
.inline-add{display:flex;gap:6px}.inline-add input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:6px 8px}
.linkbtn{display:inline-block;margin:0 10px 4px 0;font-size:15px;color:var(--gold);text-decoration:none}.linkbtn:hover{color:var(--gold-hi);text-decoration:underline}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}.list-head h3{font-family:'Cinzel',serif;color:var(--gold);margin:0 0 6px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
@media(max-width:699px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}}
.card{background:var(--panel);cursor:pointer;overflow:hidden;transition:transform .15s}.card:hover{transform:translateY(-2px)}
.card-img{aspect-ratio:4/3}.card-body{padding:9px 10px 11px}
.card-title{font-family:'Cinzel',serif;font-size:15px;font-weight:600;line-height:1.2}.card-sub{font-size:13px;color:var(--dim);margin-top:2px}
.card-badges{margin-top:5px;display:flex;gap:8px;align-items:center}
.bar{height:3px;background:#2a261e;margin-top:8px}.bar i{display:block;height:100%;background:#5a8a40}
.stamp{font-family:'Cinzel',serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--gold)}.stamp.planned{color:var(--slate)}.stamp.visited{color:var(--moss-hi)}
.star{color:var(--gold-hi)}
.empty{text-align:center;color:var(--dim);font-style:italic;padding:40px 10px}
#mapEl{height:calc(100vh - 260px);min-height:420px;background:#1a1610}@media(max-width:699px){#mapEl{height:66vh}}
#mapEl .leaflet-tile-pane{filter:sepia(.85) saturate(.9) brightness(.9) contrast(1.05) hue-rotate(-8deg)}
.leaflet-popup-content-wrapper{background:#f0e2c0;color:var(--ink);border-radius:2px;font-family:'Crimson Text',serif}.leaflet-popup-tip{background:#f0e2c0}
.pop-sub{font-size:13px;color:var(--ink-soft)}.pop button{margin-top:6px;background:#221e17;color:#c8a050;border:1px solid #7a5e28;padding:3px 10px;cursor:pointer}
.pin{width:30px;height:30px;border-radius:50%;background:#14110c;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.pin.visited{border-color:#8fb872}.pin.planned{border-color:#6a8aa0}.pin.must{box-shadow:0 0 0 3px rgba(232,200,120,.45),0 2px 6px rgba(0,0,0,.6)}
.map-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
/* voyages */
.v-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.v-top select,.v-opts select,.v-opts input{background:var(--panel2);color:var(--text);border:1px solid var(--leather);padding:7px 9px}
.v-opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.v-opts label{font-size:14px;color:var(--dim);display:flex;gap:6px;align-items:center}
.v-layout{display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:1000px){.v-layout{grid-template-columns:minmax(0,1fr) 340px}.picker{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 30px);overflow:auto}}
.day{background:var(--panel);margin-bottom:12px;padding:10px 14px;border-left:3px solid transparent}.day.active{border-left-color:var(--gold)}
.day-head{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}.day-head b{font-family:'Cinzel',serif;color:var(--gold-hi);font-weight:600}
.day-head .sp{flex:1}.warn{color:#e08a75}
.day ul{list-style:none;margin:8px 0;padding:0}
.day li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.mv{display:flex;flex-direction:column}.mv button{background:none;border:none;color:var(--dim);cursor:pointer;font-size:9px;line-height:1.1;padding:1px 3px}
.it{flex:1;min-width:0}.it small{color:var(--dim);margin-left:6px}
.it input{display:block;width:100%;background:none;border:none;border-bottom:1px dashed var(--line);color:var(--dim);padding:2px 0;font-size:14px}
.picker h3{font-family:'Cinzel',serif;color:var(--gold);font-size:14px;margin:0 0 8px;letter-spacing:1px}
.picker>input{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:7px 9px;margin-bottom:8px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.pk small{display:block;color:var(--dim);font-size:13px}.pk.used b{color:var(--dim)}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(6,5,3,.84);display:flex;align-items:flex-start;justify-content:center;padding:26px 12px;overflow-y:auto;z-index:50}
.modal{background:linear-gradient(180deg,#f5e6c8,#e0cea0);color:var(--ink);max-width:580px;width:100%;border:3px solid var(--leather);padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.7)}
.modal h2{font-family:'Cinzel',serif;text-transform:uppercase;letter-spacing:2px;font-size:18px;margin:0 0 12px}
.x{position:absolute;top:8px;right:12px;background:none;border:none;font-size:24px;cursor:pointer;color:var(--ink-soft)}
.f{display:flex;flex-direction:column;gap:10px}.f label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:2px}
.f input[type=text],.f input[type=url],.f input[type=number],.f select,.f textarea{width:100%;font-size:16px;padding:7px 9px;border:1px solid var(--ps);background:#fbf6e8;color:var(--ink)}
.f textarea{min-height:60px;resize:vertical}.fr{display:flex;gap:10px}.fr>div{flex:1;min-width:0}
@media(max-width:480px){.fr{flex-direction:column}}
.f .btn{background:#221e17}.f .btn.ghost{background:transparent;color:var(--ink-soft);border-color:var(--ink-soft)}.f .btn.danger{background:transparent}
.more{border-top:1px dashed var(--ps);padding-top:8px}.more summary{cursor:pointer;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}.more .f{margin-top:8px}
.lk{background:#fbf6e8;border:1px solid var(--ps);max-height:170px;overflow:auto;margin-top:6px}.lk div{padding:6px 8px;cursor:pointer;font-size:14px;border-bottom:1px solid #e0d2ae}.lk div:hover{background:#f0e2c0}
.status-line{font-style:italic;font-size:14px;color:var(--ink-soft);min-height:18px}
.prev{width:70px;height:50px;object-fit:cover;border:1px solid var(--ps)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}.actions .del{margin-right:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:90vw;background:#2f4a22;color:#e8f2dc;border:1px solid #5a8a40;padding:9px 16px;z-index:100;font-size:15px}.toast.bad{background:#5c2a1e;color:#fbe9e2;border-color:#e08a75}
</style>
</head>
<body>
<div id="userBar" class="user-bar" hidden>
  <span><span class="dot"></span> <span id="codeLabel"></span></span>
  <button id="btnRefresh" class="user-link">↻ Refresh</button>
  <button id="btnBackup" class="user-link">⬇ Backup</button>
  <button id="btnDisconnect" class="user-link">Switch code</button>
</div>
<div id="toast" class="toast" hidden></div>

<div id="authOverlay" class="modal-overlay" hidden>
  <div class="modal" style="max-width:420px">
    <h2>Connect your ledger</h2>
    <p class="status-line" style="margin-top:-6px">Use the same code on every device — and share it with a travel companion to share the atlas. No password.</p>
    <div style="display:flex;gap:8px;margin:6px 0">
      <div id="genCode" style="flex:1;font-family:'Cinzel',serif;font-size:20px;letter-spacing:3px;background:#fbf6e8;border:1px solid var(--ps);padding:9px;text-align:center"></div>
      <button type="button" class="btn ghost" id="btnCopy" style="color:var(--ink-soft);border-color:var(--ink-soft)">Copy</button>
    </div>
    <div class="actions"><button type="button" class="btn ghost" id="btnRegen" style="color:var(--ink-soft);border-color:var(--ink-soft)">Another</button><button type="button" class="btn" id="btnUseGen" style="background:#221e17">Use this code</button></div>
    <hr style="border:none;border-top:1px dashed var(--ps);margin:16px 0">
    <form id="formCode" class="f"><label>I already have a code</label>
      <input type="text" id="codeIn" placeholder="e.g. BKCX-WH5H" style="text-transform:uppercase;text-align:center;letter-spacing:2px">
      <div class="actions"><button class="btn" style="background:#221e17">Connect</button></div></form>
  </div>
</div>

<div class="app">
  <header class="app-header"><h1>The Journey</h1></header>
  <nav class="main-tabs">
    <button class="main-tab active" data-tab="discover">Discover</button>
    <button class="main-tab" data-tab="atlas">Atlas</button>
    <button class="main-tab" data-tab="voyages">Voyages</button>
  </nav>

  <section id="tab-discover">
    <div class="disc">
      <h2 class="sec-title">Chart a new discovery</h2>
      <form id="discForm" class="disc-form">
        <input type="search" id="dQ" placeholder="Search the world: Louvre, Kyoto, Iceland…" autocomplete="off">
        <select id="dKind"><option value="">Anything</option><option value="country">Country</option><option value="city">City</option><option value="place">Place</option></select>
        <button class="btn">Search</button>
      </form>
      <div id="dStatus" class="muted"></div>
      <div id="dRes" class="res-list"></div>
      <div class="disc-foot"><button class="btn ghost sm" id="btnManual">Can’t find it? Add manually</button></div>
    </div>
    <div id="recent"></div>
  </section>

  <section id="tab-atlas" hidden>
    <div class="a-bar">
      <input type="search" id="fQ" placeholder="Search your atlas…">
      <button type="button" id="fBtn" class="btn ghost">Filters</button>
      <div class="seg" id="viewSeg" style="margin:0"><button data-view="list" class="on">List</button><button data-view="map">Map</button></div>
    </div>
    <div id="fBody" class="f-body" hidden>
      <select id="fType"></select><select id="fTag"></select>
      <select id="fStatus"><option value="">Any status</option><option value="want">Wishlist</option><option value="planned">Planned</option><option value="visited">Visited</option></select>
      <label><input type="checkbox" id="fMust"> ⭐ Must-see</label>
      <select id="fSort"><option value="priority">Must-see first</option><option value="az">A–Z</option><option value="recent">Recently added</option><option value="status">Status</option></select>
      <button type="button" id="btnClear" class="btn ghost sm">Clear</button>
    </div>
    <div id="stats" class="muted"></div>
    <div id="layout" class="layout">
      <aside id="sidebar" class="sidebar"></aside>
      <main style="min-width:0">
        <div id="atlas"></div>
        <div id="mapPanel" hidden><div id="mapBar" class="map-bar"></div><div id="mapEl"></div></div>
      </main>
    </div>
  </section>

  <section id="tab-voyages" hidden><div id="voyages"></div></section>
</div>

<div id="modalForm" class="modal-overlay" hidden>
  <div class="modal">
    <button class="x" type="button" data-close>&times;</button>
    <h2 id="formTitle">New entry</h2>
    <form id="formEntry" class="f">
      <input type="hidden" id="fId">
      <div class="fr">
        <div><label>Entry</label><select id="eKind"><option value="country">Country</option><option value="city">City</option><option value="place">Place</option></select></div>
        <div id="eParentWrap"><label id="eParentLabel">Belongs to</label><select id="eParent"></select></div>
      </div>
      <div><label>Name</label><input type="text" id="eName" required></div>
      <div><button type="button" class="btn sm" id="btnLookup">🔎 Look up address, photo &amp; info</button>
        <div class="status-line" id="lkStatus"></div><div class="lk" id="lkRes" hidden></div></div>
      <div id="eAddrWrap"><label>Address</label><input type="text" id="eAddress"></div>
      <div class="fr"><div><label>Photo link</label><input type="url" id="ePhoto" placeholder="https://… (Drive share links work)"></div><div style="flex:0 0 76px"><label>&nbsp;</label><img id="ePrev" class="prev" alt="" hidden></div></div>
      <div><label>Information</label><textarea id="eInfo"></textarea></div>
      <div class="fr"><div class="only-place"><label>Category</label><select id="eType"></select></div><div><label>Status</label><select id="eStatus"><option value="want">Wishlist</option><option value="planned">Planned</option><option value="visited">Visited</option></select></div></div>
      <details class="more"><summary>More details</summary>
        <div class="f">
          <div class="fr"><div><label>Latitude</label><input type="number" id="eLat" step="any"></div><div><label>Longitude</label><input type="number" id="eLng" step="any"></div></div>
          <div><label>Or paste a full Google Maps link</label><div style="display:flex;gap:6px"><input type="url" id="eMaps" placeholder="https://www.google.com/maps/place/…"><button type="button" class="btn sm" id="btnMaps">Import</button></div></div>

function $(i){return document.getElementById(i);}
function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function toast(m,bad){var e=$('toast');e.textContent=(bad?'⚠️ ':'')+m;e.className='toast'+(bad?' bad':'');e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true;},bad?8000:2500);}

/* ---------- data ---------- */
function fromRow(r){var n=function(v){return v==null?null:Number(v);};return{id:r.id,kind:r.kind,parentId:r.parent_id||'',name:r.name,photo:r.photo||'',info:r.info||'',address:r.address||'',lat:n(r.lat),lng:n(r.lng),type:r.type||'',tags:r.tags?r.tags.split(',').map(function(t){return t.trim();}).filter(Boolean):[],status:r.status||'want',must:!!r.must,pois:Array.isArray(r.pois)?r.pois:[],links:Array.isArray(r.links)?r.links:[],hours:r.hours||'',price:r.price||'',durationH:n(r.duration_h),season:r.season||'',website:r.website||'',addedAt:r.added_at?new Date(r.added_at).getTime():Date.now()};}
function toRow(n){return{id:n.id,sync_code:code,kind:n.kind,parent_id:n.parentId||null,name:n.name,photo:n.photo||null,info:n.info||null,address:n.address||null,lat:n.lat,lng:n.lng,type:n.type||null,tags:(n.tags||[]).join(', ')||null,status:n.status,must:!!n.must,pois:n.pois||[],links:n.links||[],hours:n.hours||null,price:n.price||null,duration_h:n.durationH,season:n.season||null,website:n.website||null,added_at:new Date(n.addedAt||Date.now()).toISOString()};}
function blank(kind,name,parentId){return{id:uid(),kind:kind,parentId:parentId||'',name:name,photo:'',info:'',address:'',lat:null,lng:null,type:'',tags:[],status:'want',must:false,pois:[],links:[],hours:'',price:'',durationH:null,season:'',website:'',addedAt:Date.now()};}
function tripFromRow(r){return{id:r.id,name:r.name,startDate:r.start_date||'',scopeId:r.scope_id||'',days:Array.isArray(r.days)?r.days:[],addedAt:r.added_at?new Date(r.added_at).getTime():Date.now()};}
function reindex(){S.by={};S.kids={};S.nodes.forEach(function(n){S.by[n.id]=n;});S.nodes.forEach(function(n){var p=n.parentId&&S.by[n.parentId]?n.parentId:'';(S.kids[p]=S.kids[p]||[]).push(n);});}
function cacheNow(){try{localStorage.setItem(CACHE+code,JSON.stringify(S.nodes));}catch(e){}}
function cacheTrips(){try{localStorage.setItem(TCACHE+code,JSON.stringify(S.trips));}catch(e){}}
function loadCache(){try{S.nodes=JSON.parse(localStorage.getItem(CACHE+code)||'[]');}catch(e){S.nodes=[];}}
function loadTripsCache(){try{S.trips=JSON.parse(localStorage.getItem(TCACHE+code)||'[]');}catch(e){S.trips=[];}}
function fail(e){var m=(e&&e.message)||'network error';toast('Not synced: '+m+(/journey_/.test(m)?' — run journey-setup.sql in Supabase.':''),true);}
function loadAll(){
  function done(){reindex();if(!S.tripId||!S.trips.some(function(t){return t.id===S.tripId;}))S.tripId=S.trips.length?S.trips[0].id:null;renderAll();}
  if(!sb){loadCache();loadTripsCache();done();toast('Offline — showing saved copy.',true);return;}
  Promise.all([sb.from(TABLE).select('*').eq('sync_code',code),sb.from(TRIPS).select('*').eq('sync_code',code)]).then(function(r){
    if(r[0].error){fail(r[0].error);loadCache();}else{S.nodes=(r[0].data||[]).map(fromRow);cacheNow();}
    if(r[1].error){fail(r[1].error);loadTripsCache();}else{S.trips=(r[1].data||[]).map(tripFromRow);cacheTrips();}
    done();
  },function(e){fail(e);loadCache();loadTripsCache();done();});
}
function saveNode(n){cacheNow();if(!sb)return;sb.from(TABLE).upsert(toRow(n),{onConflict:'id'}).then(function(r){if(r.error)fail(r.error);},fail);}
function delIds(ids){cacheNow();if(!sb)return;sb.from(TABLE).delete().in('id',ids).eq('sync_code',code).then(function(r){if(r.error)fail(r.error);},fail);}
function saveTrip(t){cacheTrips();if(!sb)return;sb.from(TRIPS).upsert({id:t.id,sync_code:code,name:t.name,start_date:t.startDate||null,scope_id:t.scopeId||null,days:t.days,added_at:new Date(t.addedAt||Date.now()).toISOString()},{onConflict:'id'}).then(function(r){if(r.error)fail(r.error);},fail);}
function delTrip(id){cacheTrips();if(!sb)return;sb.from(TRIPS).delete().eq('id',id).eq('sync_code',code).then(function(r){if(r.error)fail(r.error);},fail);}

/* ---------- helpers ---------- */
function desc(id){var o=[],st=(S.kids[id]||[]).slice(),n;while(st.length){n=st.pop();o.push(n);(S.kids[n.id]||[]).forEach(function(c){st.push(c);});}return o;}
function path(n){var p=[],c=n;while(c){p.unshift(c);c=c.parentId?S.by[c.parentId]:null;}return p;}
function ctx(n){return path(n).slice(0,-1).reverse().map(function(p){return p.name;}).join(' · ');}
function placesIn(n){return n.kind==='place'?[n]:desc(n.id).filter(function(x){return x.kind==='place';});}
function icon(n){return n.kind==='country'?'🌍':n.kind==='city'?'🏙️':(TYPES[n.type]||TYPES.other)[0];}
function has(k){return S.nodes.some(function(n){return n.kind===k;});}
function az(a,b){return a.name.localeCompare(b.name);}
function plural(n,s,p){return n+' '+(n===1?s:p);}
function hasF(){var f=S.f;return !!(f.q||f.type||f.tag||f.status||f.must);}
function matchSelf(n){var f=S.f;
  if(f.q&&norm([n.name,n.address,n.info,(n.tags||[]).join(' '),n.kind==='place'?(TYPES[n.type]||TYPES.other)[1]:''].join(' ')).indexOf(norm(f.q))<0)return false;
  if(f.type&&!(n.kind==='place'&&n.type===f.type))return false;
  if(f.tag&&n.tags.indexOf(f.tag)<0)return false;
  if(f.status&&n.status!==f.status)return false;
  if(f.must&&!n.must)return false;return true;}
function matches(n){if(!hasF()||matchSelf(n))return true;return n.kind!=='place'&&desc(n.id).some(matchSelf);}
function sortList(a){var s=S.f.sort;return a.slice().sort(function(x,y){
  if(s==='az')return az(x,y);if(s==='recent')return y.addedAt-x.addedAt;
  if(s==='status')return (SORDER[x.status]-SORDER[y.status])||az(x,y);
  return ((y.must?1:0)-(x.must?1:0))||az(x,y);});}
function listFor(){
  var cur=S.nav?S.by[S.nav]:null;
  if(!cur){var k=S.scope==='countries'?'country':S.scope==='cities'?'city':'place';return S.nodes.filter(function(n){return n.kind===k&&matches(n);});}
  if(cur.kind==='country')return S.mode==='places'?desc(cur.id).filter(function(n){return n.kind==='place'&&matches(n);}):(S.kids[cur.id]||[]).filter(function(n){return n.kind==='city'&&matches(n);});
  if(cur.kind==='city')return (S.kids[cur.id]||[]).filter(function(n){return n.kind==='place'&&matches(n);});
  return [];}
function gmaps(n){var q=n.lat!=null&&n.lng!=null?n.lat+','+n.lng:encodeURIComponent(n.name+' '+ctx(n));return 'https://www.google.com/maps/search/?api=1&query='+q;}

/* ---------- navigation ---------- */
function switchTab(t){S.tab=t;['discover','atlas','voyages'].forEach(function(x){$('tab-'+x).hidden=x!==t;});
  document.querySelectorAll('.main-tab').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-tab')===t);});renderAll();window.scrollTo(0,0);}
function navigate(id,list){S.nav=id&&S.by[id]?id:null;S.mapAll=false;S.mapIds=null;if(list)S.view='list';if(S.tab!=='atlas')switchTab('atlas');else renderAll();}
function renderAll(){
  if(S.tab==='discover')return renderDiscover();

  $('stats').textContent=S.nodes.length?plural(S.nodes.filter(function(n){return n.kind==='country';}).length,'country','countries')+' · '+plural(S.nodes.filter(function(n){return n.kind==='city';}).length,'city','cities')+' · '+plural(pl.length,'place','places')+' · '+pl.filter(function(p){return p.status==='visited';}).length+' visited':'';
  $('fBtn').textContent='Filters'+(hasF()?' •':'');

function refreshFilters(){
  var tc={},gc={};S.nodes.forEach(function(n){if(n.kind==='place'&&n.type)tc[n.type]=(tc[n.type]||0)+1;n.tags.forEach(function(t){gc[t]=(gc[t]||0)+1;});});

  $('fType').innerHTML='<option value="">All categories</option>'+Object.keys(TYPES).filter(function(k){return tc[k];}).map(function(k){return '<option value="'+k+'">'+TYPES[k][0]+' '+TYPES[k][1]+' ('+tc[k]+')</option>';}).join('');

  $('fType').value=S.f.type;$('fTag').value=S.f.tag;}

function renderSidebar(){
  var onp={};if(S.nav&&S.by[S.nav])path(S.by[S.nav]).forEach(function(n){onp[n.id]=1;});
  function row(n,d,cnt,open,canOpen){return '<div class="tree-line" style="padding-left:'+d*14+'px"><button class="chev" data-toggle="'+n.id+'">'+(canOpen?(open?'▾':'▸'):'')+'</button><button class="tree-row'+(S.nav===n.id?' active':'')+'" data-nav="'+n.id+'"><span>'+esc(n.name)+'</span><span class="cnt">'+cnt+'</span></button></div>';}
  var h='<div class="side-title">The Atlas</div><div class="tree-line"><button class="chev"></button><button class="tree-row'+(S.nav===null?' active':'')+'" data-nav="">World <span class="cnt">'+S.nodes.filter(function(n){return n.kind==='place';}).length+'</span></button></div>';
  S.nodes.filter(function(n){return n.kind==='country';}).sort(az).forEach(function(c){
    var cities=(S.kids[c.id]||[]).filter(function(x){return x.kind==='city';}).sort(az),o=S.open[c.id]||onp[c.id];
    h+=row(c,0,placesIn(c).length,o,cities.length>0);
    if(o)cities.forEach(function(ci){var pl=(S.kids[ci.id]||[]).filter(function(x){return x.kind==='place';}).sort(az),o2=S.open[ci.id]||onp[ci.id];
      h+=row(ci,1,pl.length,o2,pl.length>0);if(o2)pl.forEach(function(p){h+=row(p,2,'',false,false);});});});
  $('sidebar').innerHTML=h;}

function stamp(n){return n.status==='want'?'':'<span class="stamp '+n.status+'">'+STAT[n.status]+'</span>';}
function cardSub(n){
  if(n.kind==='country')return plural((S.kids[n.id]||[]).length,'city','cities')+' · '+plural(placesIn(n).length,'place','places');
  if(n.kind==='city')return ctx(n)+' · '+plural(placesIn(n).length,'place','places');
  return (TYPES[n.type]||TYPES.other)[1]+(ctx(n)?' · '+ctx(n):'');}
function card(n){
  var ph=safe(n.photo),pl=n.kind!=='place'?placesIn(n):[],bar='';
  if(pl.length){var v=pl.filter(function(p){return p.status==='visited';}).length;if(v)bar='<div class="bar" title="'+v+' of '+pl.length+' visited"><i style="width:'+Math.round(v/pl.length*100)+'%"></i></div>';}
  var bd=stamp(n)+(n.must?'<span class="star">⭐</span>':'');
  return '<div class="card" data-open="'+n.id+'"><div class="card-img"><div class="ph">'+icon(n)+'</div>'+(ph?'<img data-hide src="'+esc(ph)+'" loading="lazy" referrerpolicy="no-referrer" alt="">':'')+'</div><div class="card-body"><div class="card-title">'+esc(n.name)+'</div><div class="card-sub">'+esc(cardSub(n))+'</div>'+(bd?'<div class="card-badges">'+bd+'</div>':'')+bar+'</div></div>';}

function hero(n){
  var ph=safe(n.photo),h='<section class="hero"><div class="hero-img"><div class="ph">'+icon(n)+'</div>'+(ph?'<img data-hide src="'+esc(ph)+'" referrerpolicy="no-referrer" alt="">':'')+'</div><div class="hero-body">';
  h+='<div class="kindlabel">'+(n.kind==='place'?(TYPES[n.type]||TYPES.other)[1]:n.kind==='city'?'City':'Country')+(ctx(n)?' · '+esc(ctx(n)):'')+'</div><h2>'+esc(n.name)+(n.must?' <span class="star">⭐</span>':'')+'</h2>';
  if(n.tags.length)h+='<div class="chips">'+n.tags.map(function(t){return '#'+esc(t);}).join('  ')+'</div>';
  if(n.address)h+='<div class="addr">'+esc(n.address)+'</div>';
  else if(n.kind==='place'&&n.lat==null)h+='<div class="hint">No location yet — Edit → “Look up”.</div>';
  h+='<div class="row"><div class="seg" style="margin:0">'+['want','planned','visited'].map(function(s){return '<button data-act="status" data-val="'+s+'" class="'+(n.status===s?'on':'')+'">'+STAT[s]+'</button>';}).join('')+'</div><button class="btn sm ghost" data-act="must">'+(n.must?'⭐ Must-see':'☆ Must-see')+'</button></div>';
  h+='<div class="row"><button class="btn sm" data-act="edit">Edit</button>'+(n.lat!=null?'<button class="btn sm ghost" data-act="showmap">On map</button>':'')+'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+esc(gmaps(n))+'">Google Maps ↗</a>'+(safe(n.website)?'<a class="btn sm ghost" target="_blank" rel="noopener" href="'+esc(safe(n.website))+'">Website ↗</a>':'')+(n.kind!=='place'?'<button class="btn sm ghost" data-act="addchild">+ '+(n.kind==='country'?'City':'Place')+'</button>':'')+'</div>';
  if(n.info)h+='<div class="info">'+esc(n.info)+'</div>';
  var facts=[];if(n.kind==='place'){if(n.hours)facts.push(['Hours',n.hours]);if(n.price)facts.push(['Price',n.price]);if(n.durationH!=null)facts.push(['Visit',n.durationH+' h']);}
  if(n.season)facts.push(['Best season',n.season]);
  if(facts.length)h+='<div class="facts">'+facts.map(function(f){return '<span><small>'+f[0]+'</small>'+esc(f[1])+'</span>';}).join('')+'</div>';
  var done=n.pois.filter(function(p){return p.done;}).length,ex=n.kind==='place'?'a specific artwork, room, dish…':n.kind==='city'?'a neighborhood, market, day trip…':'a region, route, tradition…';
  h+='<div class="block"><h3>Points of interest '+(n.pois.length?'<span class="muted">('+done+'/'+n.pois.length+')</span>':'')+'</h3><ul class="pois">'+n.pois.map(function(p,i){return '<li><label><input type="checkbox" data-poi="'+i+'"'+(p.done?' checked':'')+'><span class="'+(p.done?'done':'')+'">'+esc(p.t)+'</span></label><button data-act="delpoi" data-i="'+i+'" title="Remove">✕</button></li>';}).join('')+'</ul><form class="inline-add" id="poiForm"><input id="poiIn" placeholder="Add: '+ex+'"><button class="btn sm">Add</button></form></div>';
  var lk=n.links.filter(function(l){return safe(l.url);});
  if(lk.length)h+='<div class="block"><h3>Links</h3>'+lk.map(function(l){return '<a class="linkbtn" target="_blank" rel="noopener" href="'+esc(safe(l.url))+'">'+esc(l.label||'Link')+' ↗</a>';}).join('')+'</div>';
  return h+'</div></section>';}

function renderAtlas(){
  var el=$('atlas'),cur=S.nav?S.by[S.nav]:null,h='';
  if(!S.nodes.length){el.innerHTML='<p class="empty">Your atlas is empty.<br>Head to <b>Discover</b> to add your first destination.</p>';return;}
  h+='<nav class="crumbs"><button data-crumb="">World</button>'+(cur?path(cur).map(function(p){return ' › '+(p===cur?'<b>'+esc(p.name)+'</b>':'<button data-crumb="'+p.id+'">'+esc(p.name)+'</button>');}).join(''):'')+'</nav>';
  if(!cur)h+='<div class="seg">'+[['countries','Countries'],['cities','Cities'],['places','Places']].map(function(s){return '<button data-scope="'+s[0]+'" class="'+(S.scope===s[0]?'on':'')+'">'+s[1]+'</button>';}).join('')+'</div>';
  else h+=hero(cur);
  if(!cur||cur.kind!=='place'){
    var items=sortList(listFor());
    h+='<div class="list-head">'+(cur&&cur.kind==='country'?'<div class="seg" style="margin:0"><button data-mode="cities" class="'+(S.mode==='cities'?'on':'')+'">Cities</button><button data-mode="places" class="'+(S.mode==='places'?'on':'')+'">All places</button></div>':cur?'<h3>Places in '+esc(cur.name)+'</h3>':'<span></span>')+'<span class="muted">'+items.length+' shown</span></div>';
    h+=items.length?'<div class="cards">'+items.map(card).join('')+'</div>':'<p class="empty">'+(hasF()?'Nothing matches these filters.':'Nothing here yet.')+'</p>';}
  el.innerHTML=h;}

/* ---------- atlas events ---------- */
$('atlas').addEventListener('click',function(e){
  var t=e.target.closest('[data-act],[data-open],[data-scope],[data-mode],[data-crumb]');if(!t)return;

  if(t.hasAttribute('data-crumb'))return navigate(t.getAttribute('data-crumb'));
  if(t.hasAttribute('data-scope')){S.scope=t.getAttribute('data-scope');return renderAtlas();}
  if(t.hasAttribute('data-mode')){S.mode=t.getAttribute('data-mode');return renderAtlas();}
  var n=S.by[S.nav];if(!n)return;var a=t.getAttribute('data-act');
  if(a==='status'){n.status=t.getAttribute('data-val');}
  else if(a==='must'){n.must=!n.must;}
  else if(a==='edit')return openForm(n);
  else if(a==='addchild')return openForm(null,{kind:n.kind==='country'?'city':'place',parentId:n.id});
  else if(a==='showmap'){S.mapAll=false;S.mapIds=null;S.view='map';return renderAll();}
  else if(a==='delpoi'){n.pois.splice(+t.getAttribute('data-i'),1);}

/* ---------- lookup inside the form ---------- */
function lookup(auto,wikiOnly){
  var kind=$('eKind').value,name=$('eName').value.trim(),st=$('lkStatus'),res=$('lkRes');if(!name){if(!auto)st.textContent='Type a name first.';return;}
  var tok=++S.tok,trail=[];
  if(kind!=='country'){var v=$('eParent').value;if(v==='__new__'&&S.pend)trail=[kind==='place'?S.pend.city:'',S.pend.country].filter(Boolean);else if(S.by[v])trail=path(S.by[v]).reverse().map(function(p){return p.name;});}
  st.textContent='Searching…';res.hidden=true;
  var nom=wikiOnly?Promise.resolve(null):fetch(NOM+'&limit=6&q='+encodeURIComponent([name].concat(trail).join(', '))+(kind==='country'?'&featuretype=country':kind==='city'?'&featuretype=city':'')).then(function(r){if(!r.ok)throw 0;return r.json();}).catch(function(){return null;});
  Promise.all([nom,wikiGet(name+(trail[0]?' '+trail[0]:''))]).then(function(r){
    if(tok!==S.tok)return;var list=r[0]||[],w=r[1],msg=[];
    if(w){var ph=w.thumbnail&&w.thumbnail.source;
      if(ph&&(!$('ePhoto').value||(!auto&&confirm('Replace the current photo with the one found?')))){$('ePhoto').value=ph;prev();msg.push('photo');}
      if(w.extract&&(!$('eInfo').value||(!auto&&confirm('Replace the current information text?')))){$('eInfo').value=w.extract;msg.push('info');}}
    if(list.length){res.innerHTML=list.map(function(x,i){return '<div data-i="'+i+'">'+esc(x.display_name)+'</div>';}).join('');res.hidden=false;
      res.onclick=function(ev){var d=ev.target.closest('[data-i]');if(!d)return;var x=list[+d.getAttribute('data-i')];$('eLat').value=(+x.lat).toFixed(6);$('eLng').value=(+x.lon).toFixed(6);if($('eKind').value!=='country')$('eAddress').value=x.display_name;res.hidden=true;st.textContent='Location set.';};
      msg.push('pick a location below');}
    st.textContent=wikiOnly?(msg.length?'Photo and info filled in from Wikipedia.':''):(msg.length?'Found: '+msg.join(', ')+'.':'Nothing found — fill in manually.');});}
$('btnLookup').addEventListener('click',function(){lookup(false,false);});
$('btnMaps').addEventListener('click',function(){
  var u=$('eMaps').value.trim(),st=$('lkStatus'),la,ln,m;
  if(/goo\.gl|maps\.app/.test(u)){st.textContent='Short links can’t be read — open it, then paste the full address from the browser bar.';return;}
  m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(m){la=m[1];ln=m[2];}
  m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);if(m){la=m[1];ln=m[2];}
  m=u.match(/[?&](?:q|query|ll)=(-?\d+\.\d+),(-?\d+\.\d+)/);if(m&&!la){la=m[1];ln=m[2];}
  if(!la){st.textContent='No coordinates found in that link.';return;}
  $('eLat').value=la;$('eLng').value=ln;m=u.match(/\/place\/([^\/@?]+)/);
  if(m&&!$('eName').value.trim()){try{$('eName').value=decodeURIComponent(m[1].replace(/\+/g,' '));}catch(x){}}
  st.textContent='Coordinates imported.';});

/* ---------- auth / utils ---------- */
var CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){function p(){var s='';for(var i=0;i<4;i++)s+=CH[Math.floor(Math.random()*CH.length)];return s;}return p()+'-'+p();}
function regen(){$('genCode').textContent=genCode();}regen();
$('btnRegen').addEventListener('click',regen);
$('btnCopy').addEventListener('click',function(){if(navigator.clipboard)navigator.clipboard.writeText($('genCode').textContent);toast('Copied');});
$('btnUseGen').addEventListener('click',function(){connect($('genCode').textContent);});
$('formCode').addEventListener('submit',function(e){e.preventDefault();var c=$('codeIn').value.trim().toUpperCase();if(c)connect(c);});
$('btnDisconnect').addEventListener('click',function(){if(!confirm('Disconnect this device from the code? You can reconnect any time.'))return;localStorage.removeItem(CODE_KEY);code=null;S.nodes=[];S.trips=[];S.tripId=null;S.nav=null;reindex();$('authOverlay').hidden=false;$('userBar').hidden=true;regen();});
$('btnRefresh').addEventListener('click',loadAll);
$('btnBackup').addEventListener('click',function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({exported:new Date().toISOString(),nodes:S.nodes,trips:S.trips},null,2)],{type:'application/json'}));a.download='the-journey-backup.json';document.body.appendChild(a);a.click();a.remove();});
function connect(c){code=c;localStorage.setItem(CODE_KEY,c);$('authOverlay').hidden=true;$('userBar').hidden=false;$('codeLabel').textContent=c;loadAll();}
var saved=localStorage.getItem(CODE_KEY);if(saved)connect(saved);else $('authOverlay').hidden=false;
})();
</script>
